[project]
name = "antigravity-quota-portal"
version = "1.1.0"
description = "Antigravity Quota & Usage Management Portal"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "apscheduler>=3.10.4",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "google-cloud-firestore>=2.19.0",
    "google-cloud-bigquery>=3.26.0",
    "google-api-python-client>=2.150.0",
    "google-api-core>=2.20.0",
    "google-auth>=2.35.0",
    "pytz>=2024.2",
    "httpx>=0.27.0",
    "requests>=2.32.0",
    "python-dotenv>=1.0.0",
    "google-cloud-logging>=3.11.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.7.0",
    "selenium>=4.25.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning:starlette.testclient"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
per-file-ignores = { "scripts/*.py" = ["E402", "E501"] }
